# Read the Docs builds the site with MkDocs (not Sphinx) from this repository on every push:
# https://aaspire.readthedocs.io. See https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# The site is MkDocs with the Material theme: mkdocs.yml at the root, the pages in docs/.
mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt

# AASPIRE's documentation site (https://aaspire.readthedocs.io once Read the Docs builds it). Here:
#   python -m mkdocs serve        # http://127.0.0.1:8000, rebuilt on every save
#   python -m mkdocs build --strict
# How the pages and the figures are made: docs/how-to/this-site.md.
site_name: AASPIRE
site_description: >-
  AAS-based Planning, Integration, Reconfiguration and Execution: plug and produce with the Asset
  Administration Shell. How to describe, plug in, change and run a production line from its AASs.
site_author: AAU Smart Production Lab
copyright: AAU Smart Production Lab, the AP2030 project
repo_url: https://github.com/AAU-AASPIRE/aaspire
repo_name: AAU-AASPIRE/aaspire
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  font: false                     # the system's fonts: nothing fetched from outside, Arial like the figures
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/aaspire.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: info

nav:
  - Home: index.md
  - Overview:
      - Repositories: overview/repositories.md
      - Glossary: overview/glossary.md
  - AAS:
      - aas/index.md
      - aas-model: aas/aas-model.md
      - Ontologies: aas/ontologies.md
  - Planning:
      - planning/index.md
      - modplan: planning/modplan.md
  - Integration:
      - integration/index.md
      - Registration service: integration/registration.md
      - DMP: integration/dmp.md
      - modlink: integration/modlink.md
  - Reconfiguration:
      - reconfiguration/index.md
      - modsync: reconfiguration/modsync.md
      - Skill library: reconfiguration/skill-lib.md
      - Management library: reconfiguration/mgmt.md
      - FORTE runtime: reconfiguration/runtime.md
  - Execution:
      - execution/index.md
      - Line agents: execution/agents.md
      - Planar controller: execution/planar-controller.md
  - Interfaces: interfaces/web-ui.md
  - Deployment: deployment/deploy.md
  - Lines:
      - "A line's repository": lines/aseptic-line.md
      - "Example: the line's AASs": reference/aas-examples.md
      - "Example: the filling and stoppering modules": reference/modules.md
      - "Example: the filling program": reference/filling-program.md
      - "Example: the filling program, with screenshots": reference/filling-program-screenshots.md
  - How-to:
      - Run a module on a PC: how-to/simulation.md
      - Deploy a module to an edge device: how-to/raspberry-pi.md
      - Register a module, publish a line: how-to/register.md
      - Change a skill online: how-to/change-a-skill.md
      - Work on this site: how-to/this-site.md
  - Reference:
      - "The AAS models": reference/aas-models.md
      - "The product, process and resource model": reference/ppr-model.md
      - "The Production Sequence as a precedence graph": reference/precedence-graphs.md
      - "How a module is built: the rules": reference/module-rules.md
      - "From the AAS to IEC 61499 and back": reference/mapping.md
      - "From AAS to running code, and back": reference/pipeline.md
      - "Building skills and equipment": reference/building-skills.md
      - "Authoring skills": reference/skill-authoring.md
      - "Composing skills from capabilities": reference/skill-planning.md
      - "Locations and layout": reference/locations-and-layout.md
      - "Building FORTE for the Raspberry Pi": reference/forte-for-the-pi.md
      - "How the tools work": reference/tools.md
      - "Tools and how the work is checked": reference/tooling.md
